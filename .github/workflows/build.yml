name: Build ModernUninstaller (eigener Server)

# Bewusst keine pull_request-Builds: Fremder Code darf nicht auf dem
# eigenen, dauerhaft betriebenen Self-hosted Runner ausgefuehrt werden.
on:
  push:
    branches: [main]
    tags: ['v*']
  workflow_dispatch:
    inputs:
      target:
        description: 'preflight = nur kompilieren; build = Windows x64 + ARM64 erzeugen'
        type: choice
        required: true
        default: build
        options:
          - preflight
          - build

# Nur der Release-Job erhaelt Schreibrechte.
permissions:
  contents: read

concurrency:
  group: modernuninstaller-${{ github.ref }}
  cancel-in-progress: false

env:
  DOTNET_CLI_TELEMETRY_OPTOUT: '1'
  DOTNET_NOLOGO: '1'

jobs:
  build:
    name: Cross-Build auf eigenem Linux-Server
    # Der Runner muss im Repository (oder auf Org-Ebene mit Zugriff auf
    # dieses Repo) online sein. Kein GitHub-gehosteter Windows-Runner.
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 50

    steps:
      - name: Quellcode holen
        uses: actions/checkout@v4

      - name: .NET 9 SDK bereitstellen
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '9.0.x'

      - name: Server und SDK anzeigen
        shell: bash
        run: |
          uname -a
          dotnet --info

      - name: Windows-Referenzpakete wiederherstellen
        shell: bash
        run: dotnet restore ModernUninstaller.sln -p:EnableWindowsTargeting=true

      - name: Preflight - WPF-Projekt kompilieren
        shell: bash
        run: dotnet build ModernUninstaller.sln -c Release --no-restore -p:EnableWindowsTargeting=true

      # WPF-Tests koennen auf Linux nicht ausgefuehrt werden.
      # Auf dem Linux-Runner findet nur die Kompilierung statt.
      - name: Windows x64 und ARM64 als Einzeldatei bauen
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'build' }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          for rid in win-x64 win-arm64; do
            echo "=== Build fuer $rid ==="
            dotnet publish src/ModernUninstaller/ModernUninstaller.csproj \
              -c Release \
              -r "$rid" \
              --self-contained true \
              -p:EnableWindowsTargeting=true \
              -p:PublishSingleFile=true \
              -p:IncludeNativeLibrariesForSelfExtract=true \
              -p:EnableCompressionInSingleFile=true \
              -p:PublishTrimmed=false \
              -o "dist/$rid"

            test -s "dist/$rid/ModernUninstaller.exe"
            cp "dist/$rid/ModernUninstaller.exe" "dist/ModernUninstaller-$rid.exe"
          done
          (cd dist && sha256sum ModernUninstaller-win-*.exe > SHA256SUMS)

      - name: Windows-EXE-Architekturen kontrollieren
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'build' }}
        shell: bash
        run: |
          python3 - <<'PY'
          from pathlib import Path
          for rid, expected in (("win-x64", 0x8664), ("win-arm64", 0xAA64)):
              path = Path("dist") / f"ModernUninstaller-{rid}.exe"
              content = path.read_bytes()
              if content[:2] != b"MZ":
                  raise SystemExit(f"{path}: keine Windows-EXE")
              pe = int.from_bytes(content[0x3C:0x40], "little")
              actual = int.from_bytes(content[pe + 4:pe + 6], "little")
              if actual != expected:
                  raise SystemExit(f"{path}: falsche Architektur (0x{actual:04X})")
              subsystem = int.from_bytes(content[pe + 24 + 68:pe + 24 + 70], "little")
              print(f"{path}: Architektur OK; PE-Subsystem={subsystem}")
              if subsystem != 2:
                  print("HINWEIS: Linux-Crossbuild kann ein Konsolenfenster zeigen; finalen Windows-Release unter Windows bauen.")
          PY

      - name: EXE-Dateien und SHA256 hochladen
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'build' }}
        uses: actions/upload-artifact@v4
        with:
          name: ModernUninstaller-Windows
          path: |
            dist/ModernUninstaller-win-x64.exe
            dist/ModernUninstaller-win-arm64.exe
            dist/SHA256SUMS
          if-no-files-found: error
          retention-days: 30

      - name: Hinweis zu Cross-Builds
        if: ${{ github.event_name != 'workflow_dispatch' || inputs.target == 'build' }}
        shell: bash
        run: |
          echo '### ModernUninstaller - Linux Cross-Build' >> "$GITHUB_STEP_SUMMARY"
          echo 'Windows x64/ARM64 wurden auf dem eigenen Linux-Runner gebaut. WPF-Tests wurden nicht ausgefuehrt. Eingebettetes EXE-Icon und Windows-GUI-Subsystem koennen fehlen; vor Verteilung auf Windows testen.' >> "$GITHUB_STEP_SUMMARY"

  release:
    name: Release bei v*-Tag
    needs: build
    if: ${{ startsWith(github.ref, 'refs/tags/v') }}
    runs-on: [self-hosted, Linux, X64]
    timeout-minutes: 15
    permissions:
      contents: write
    steps:
      - name: Build-Artefakte herunterladen
        uses: actions/download-artifact@v4
        with:
          name: ModernUninstaller-Windows
          path: dist

      - name: GitHub-Release erstellen und EXEs anhaengen
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            dist/ModernUninstaller-win-x64.exe
            dist/ModernUninstaller-win-arm64.exe
            dist/SHA256SUMS
